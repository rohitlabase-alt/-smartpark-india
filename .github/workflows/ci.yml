name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Single hard gate: any of the stages failing fails CI. No deploy step, no
  # secrets. Stage order: format → lint → typecheck → migrate → test → build.
  # API tests are DB-backed (Phase 2A) and run against the postgres service +
  # a throwaway `smartpark_test` database created by the test setup.
  node:
    name: Node (lint → typecheck → db:migrate → test → build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://smartpark:smartpark@localhost:5432/smartpark
      TEST_DATABASE_URL: postgresql://smartpark:smartpark@localhost:5432/smartpark_test
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: smartpark
          POSTGRES_PASSWORD: smartpark
          POSTGRES_DB: smartpark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartpark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npm run db:migrate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  contracts:
    name: Contracts (forge build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.7.1"

      - name: Forge build
        run: forge build --root contracts

      - name: Forge test
        run: forge test --root contracts
