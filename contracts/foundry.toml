[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
solc = "0.8.27"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
tab_width = 4
quote_style = "double"

# Auto-detected solc binaries are cached under cache/.
# Nothing in here is compiled into the app — see .gitignore.