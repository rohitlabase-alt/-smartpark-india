# ----------------------------------------------------------------------------
# SmartPark India — local development infrastructure (Phase 1B)
# ----------------------------------------------------------------------------
# Boots the three services the backend needs during development:
#   postgres  — source-of-truth DB (single database, V1 per docs/DATABASE.md)
#   minio     — S3-compatible object storage (docs/ARCHITECTURE.md §12)
#   anvil     — dev-only local EVM chain (docs/BLOCKCHAIN.md)
#
# Images are PINNED to known-good tags for reproducibility. Nothing here is
# production infrastructure, and credentials default to local dev values that
# are overridable via a local .env (NEVER commit .env).
#
# Usage (from repo root):
#   npm run infra:up     # start, wait for health
#   npm run infra:ps     # status
#   npm run infra:logs   # follow logs
#   npm run infra:down   # stop (keeps named volumes)
#   npm run infra:down -d   # stop AND remove volumes (full reset)
# ----------------------------------------------------------------------------

name: smartpark-infra

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: smartpark-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartpark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartpark}
      POSTGRES_DB: ${POSTGRES_DB:-smartpark}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartpark} -d ${POSTGRES_DB:-smartpark}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - smartpark

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: smartpark-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-smartpark-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-smartpark-minio-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console (dev only)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - smartpark

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    container_name: smartpark-anvil
    entrypoint:
      - anvil
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "${ANVIL_CHAIN_ID:-31337}"
    ports:
      - "${ANVIL_RPC_PORT:-8545}:8545"
    healthcheck:
      # No wget/curl in the foundry image, so probe JSON-RPC directly with
      # bash /dev/tcp. Response must carry the chain id ("0x..."), proving a
      # real eth_chainId round-trip. $ is escaped as $$ for compose.
      test:
        - CMD
        - bash
        - -c
        - 'json="{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}"; exec 3<>/dev/tcp/127.0.0.1/8545; printf "POST / HTTP/1.1\r\nHost: x\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s" "$${#json}" "$$json" >&3; { timeout 3 cat <&3; } | grep -q "0x"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - smartpark

volumes:
  postgres-data:
  minio-data:

networks:
  smartpark:
    driver: bridge
